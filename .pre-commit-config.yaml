# Pre-commit hooks for tilde. Run on every `git commit`; set up via
# `pre-commit install` (see README "Daily operation").

# Vendored base16 scheme collection (git submodule at vendor/tinted-schemes);
# never lint upstream files.
exclude: ^vendor/

repos:
  # Official Gitleaks hook. Its upstream entry scans staged content with
  # `--redact`; keep the arg explicit as defense against accidental hook drift.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--redact, --config=config/linters/gitleaks.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
        # Skip files that are not raw TOML documents:
        #   home/.chezmoiexternal.toml - a chezmoi Go template (gated by component),
        #     so it does not parse until chezmoi renders it.
        #   modify_*.toml - chezmoi modify_ scripts (e.g.
        #     home/dot_codex/modify_private_config.toml.tmpl renders to Python that
        #     merges `notify` into ~/.codex/config.toml), not TOML documents.
        exclude: |
          (?x)(
            ^home/\.chezmoiexternal\.toml$|
            (^|/)modify_[^/]*\.toml$
          )
      - id: check-json
        # chezmoi modify_ scripts that target a *.json file are executable
        # scripts (e.g. home/dot_claude/modify_settings.json.tmpl renders to Python
        # that merges hooks into ~/.claude/settings.json), not JSON documents.
        exclude: (^|/)modify_[^/]*\.json$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # zsh config files carry `#!/bin/zsh` or `#!/usr/bin/env zsh` as a
        # filetype hint but are sourced by zsh, not executed.
        exclude: |
          (?x)^(
            home/dot_zshrc$|
            home/dot_zshenv$|
            home/dot_zsh/aliases$|
            home/dot_zsh/custom/functions/.*\.zsh$
          )$

  # Shell-script linting for the install scripts in scripts/. Exclude:
  #   - chezmoi .tmpl files (Go template syntax is not valid sh)
  #   - home/dot_zsh/* — zsh is not supported by shellcheck (SC1071)
  # -x follows `# shellcheck source=...` directives inside scripts.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['-x']
        exclude: |
          (?x)^(
            .*\.tmpl$|
            home/dot_zsh/.*
          )$

  # GitHub Actions workflow linting. golang-language hook: pre-commit builds
  # it from the go toolchain already installed by scripts/install.sh (go on
  # macOS, golang on Debian), so no separate system install is needed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Markdown linting (global rule: markdownlint-compliant).
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config=config/linters/markdownlint.yaml]
        # CHANGELOG.md is generated by Release Please - its entry spacing trips
        # MD012 and it is rewritten every release, so hand-fixes never stick.
        # Leave it (and the vendored base16 submodule) out of markdownlint.
        exclude: '^(vendor/|ai/skills/interview-coach/|CHANGELOG\.md$)'

  # Lua formatting. stylua-github downloads a prebuilt binary, so no rust/cargo
  # or system stylua is required.
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github
        args: [--config-path, config/linters/stylua.toml]

  # Lua linting (static analysis). Run as a system hook, not the hosted
  # language:lua hook: luacheck 1.2.0 crashes on Lua 5.5 (Homebrew's default),
  # so install-neovim.sh installs it against Lua 5.4 and puts it on PATH, and
  # the CI workflow installs it via apt luarocks.
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        entry: luacheck --config config/linters/luacheckrc
        language: system
        types: [lua]

  # Render the component-gated chezmoi templates across combinations and parse
  # the result. check-toml skips home/.chezmoiexternal.toml (it is a Go template), so
  # this is what actually validates the rendered TOML before it reaches a host.
  - repo: local
    hooks:
      - id: validate-chezmoi-templates
        name: validate chezmoi templates render and parse
        entry: scripts/validate-templates.sh
        language: script
        pass_filenames: false
        files: ^(home/(\.chezmoiexternal\.toml|\.chezmoi(ignore|\.toml\.tmpl)|\.chezmoiscripts/run_(once|onchange)_after_.*\.sh\.tmpl|dot_gitconfig|private_dot_gitconfig\.personal\.tmpl|dot_claude/modify_settings\.json\.tmpl|dot_codex/modify_private_config\.toml\.tmpl)|scripts/(confirm-install|package-plan|validate-templates)\.sh)$

      - id: validate-palettes
        name: validate shared palettes render
        entry: scripts/validate-palettes.sh
        language: script
        pass_filenames: false
        files: ^home/(\.chezmoidata/palettes\.yaml|dot_(config/(ghostty|iterm2|notify|nvim|statusline)|tmux/conf\.d|codex/themes|zsh/theme).*)$

      - id: build-palettes-check
        name: palette catalog matches base16 schemes
        entry: python3 scripts/build-palettes.py --check
        language: system
        pass_filenames: false
        # Skips itself when the vendor/tinted-schemes submodule is absent (local
        # dev); CI checks out submodules, so it enforces there.
        files: ^(\.gitmodules|scripts/build-palettes\.py|home/(\.chezmoidata/palettes\.yaml|\.chezmoi\.toml\.tmpl))$

      - id: bats-palette-init
        name: bats (palette initialization)
        entry: bats
        args: [tests/test_palette_init.bats]
        language: system
        pass_filenames: false
        files: ^(home/\.chezmoi\.toml\.tmpl|tests/test_palette_init\.bats)$

      - id: pytest-notify
        name: pytest notify (modify_settings.json.tmpl)
        entry: uv run --with pytest pytest tests/test_merge_settings.py -v
        language: system
        pass_filenames: false
        files: ^(home/dot_claude/modify_settings\.json\.tmpl|tests/test_merge_settings\.py)$

      - id: pytest-notify-codex
        name: pytest notify (modify_private_config.toml.tmpl)
        entry: uv run --with pytest pytest tests/test_merge_codex_config.py -v
        language: system
        pass_filenames: false
        files: ^(home/dot_codex/modify_private_config\.toml\.tmpl|tests/test_merge_codex_config\.py)$

      - id: pytest-statusline-tokens
        name: pytest statusline (statusline-tokens.py)
        entry: uv run --with pytest pytest tests/test_statusline_tokens.py -v
        language: system
        pass_filenames: false
        files: ^(home/dot_claude/executable_statusline-tokens\.py|tests/test_statusline_tokens\.py|tests/fixtures/statusline/.*)$

      - id: bats-notify
        name: bats (installer + notify + statusline + render-shim + package-plan + tooling)
        entry: bats
        args: [tests/test_confirm_install.bats, tests/test_install_ai_clis.bats, tests/test_install_gate.bats, tests/test_lib.bats, tests/test_process.bats, tests/test_statusline_command.bats, tests/test_render_modify_shim.bats, tests/test_package_plan.bats, tests/test_tooling.bats]
        language: system
        pass_filenames: false
        files: ^(\.gitignore|config/linters/gitleaks\.toml|\.pre-commit-config\.yaml|ai/hooks/.*|home/dot_config/notify/.*|home/dot_config/nvim/(init\.lua|lua/gitleaks\.lua)|home/dot_zsh/custom/functions/notify-process\.zsh|home/dot_claude/executable_statusline-command\.sh|scripts/(common|confirm-install|install-ai-clis|install-ai-workspace|install-neovim|install-notify|install|package-plan|sync-ai-overlays)\.sh|home/dot_claude/modify_settings\.json\.tmpl|home/dot_codex/modify_private_config\.toml\.tmpl|tests/pty_run\.py|tests/test_(ai_workspace|confirm_install|install_ai_clis|install_gate|lib|process|statusline_command|render_modify_shim|package_plan|tooling)\.bats|tests/fixtures/.*)$

      - id: bats-tmux-startup
        name: bats (tmux startup config selection)
        entry: bats
        args: [tests/test_tmux_startup.bats]
        language: system
        pass_filenames: false
        files: ^(home/dot_zshrc|home/dot_tmux/conf\.d/notify\.conf|tests/test_tmux_startup\.bats)$

      - id: bats-source-layout
        name: bats (chezmoi source-root layout)
        entry: bats
        args: [tests/test_source_layout.bats]
        language: system
        pass_filenames: false
        files: ^(\.chezmoiroot|home/|config/linters/|scripts/|tests/test_source_layout\.bats)$

      - id: validate-ai-assets
        name: validate shareable AI assets
        entry: scripts/check-ai-assets.sh
        language: script
        pass_filenames: false
        files: ^(ai/(agents|skills)/|scripts/check-ai-assets\.sh)$

      - id: bats-ai-workspace
        name: bats (shared Claude and Codex workspace)
        entry: bats
        args: [tests/test_ai_workspace.bats]
        language: system
        pass_filenames: false
        files: ^(ai/|scripts/(install-ai-workspace|sync-ai-overlays)\.sh|home/\.chezmoiscripts/run_onchange_after_10-install-ai-workspace\.sh\.tmpl|tests/test_ai_workspace\.bats)$

      - id: bats-ci-summary
        name: bats (deployment PR summary)
        entry: bats
        args: [tests/test_ci_summary.bats]
        language: system
        pass_filenames: false
        files: ^(\.github/(scripts/render-deployment-summary\.sh|workflows/ci\.yaml)|tests/test_ci_summary\.bats)$

      - id: bats-pr-metadata
        name: bats (branch and PR title convention)
        entry: bats
        args: [tests/test_pr_metadata.bats]
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/ci\.yaml|scripts/validate-pr-metadata\.sh|tests/test_pr_metadata\.bats)$
