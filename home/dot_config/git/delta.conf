# ~/.config/git/delta.conf
# git-delta pager config. Host-agnostic and chezmoi-managed. It is loaded by an
# [include] line added by hand to ~/.gitconfig, which is deliberately NOT
# chezmoi-managed (see the chezmoi-dotfiles skill). Requires the `delta` binary
# on PATH, installed with the zsh component.
#
# syntax-theme = base16 rides the terminal's 16 ANSI colors (ghostty paints them
# from the shared palette), so delta follows the house palette with no extra
# theme file and auto-tracks a palette switch.
[core]
    pager = delta
[interactive]
    diffFilter = delta --color-only
[delta]
    navigate = true
    line-numbers = true
    syntax-theme = base16
