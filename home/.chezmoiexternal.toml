# home/.chezmoiexternal.toml
# Upstream plugins cloned by chezmoi and refreshed by approved package mode.
# Existing checkouts use refreshPeriod=0 so the installer can skip dirty or
# diverged work before a fast-forward. Gated by component:
# the zsh block only renders when components.zsh is true, the tmux block when
# components.tmux is true. Selection lives in ~/.config/chezmoi/chezmoi.toml.
# `dig` defaults a missing component to its install-by-default value so an
# un-init'd config degrades to "install everything" instead of erroring.
{{ $agentSkillsEnabled := or
     (dig "components" "ai" "claude_hooks" false .)
     (dig "components" "ai" "codex_hooks" false .)
     (dig "components" "ai" "statusline" false .)
     (dig "components" "ai" "opencode" false .)
     (dig "components" "ai" "copilot" false .)
     (dig "components" "ai" "codecompanion" false .) -}}
{{ if dig "components" "zsh" true . -}}
[".zsh/ohmyzsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "0"
    [".zsh/ohmyzsh".pull]
        args = ["--ff-only"]

[".zsh/custom/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "0"
    [".zsh/custom/plugins/zsh-autosuggestions".clone]
        args = ["--depth=1"]
    [".zsh/custom/plugins/zsh-autosuggestions".pull]
        args = ["--ff-only"]

[".zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "0"
    [".zsh/custom/plugins/zsh-syntax-highlighting".clone]
        args = ["--depth=1"]
    [".zsh/custom/plugins/zsh-syntax-highlighting".pull]
        args = ["--ff-only"]

[".zsh/custom/plugins/zsh-completions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-completions.git"
    refreshPeriod = "0"
    [".zsh/custom/plugins/zsh-completions".clone]
        args = ["--depth=1"]
    [".zsh/custom/plugins/zsh-completions".pull]
        args = ["--ff-only"]
{{ end -}}
{{ if $agentSkillsEnabled -}}
