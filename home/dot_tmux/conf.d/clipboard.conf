##### Cross-platform clipboard #####
# Built-in OSC52 integration. set-clipboard is a SERVER option, so it must be
# `set -s`; `set -g` parses fine but silently no-ops, which is why an earlier
# copy-out fix appeared to do nothing. This file is sourced after dot_tmux.conf,
# so this line is the authoritative one.
set -s set-clipboard on

# Paste classification. When keys arrive faster than this many milliseconds
# apart, tmux treats them as a paste and does NOT run them through the key
# tables. The 1ms default is tight enough that real pastes get classified as
# typing and fall through to the root `Any` binding in notify.conf, which
# re-injects via send-keys and strips the bracketed-paste envelope.
# NOTE: unbinding that `Any` key was tested on 2026-09-09 and did not fix
# multi-line paste into OpenCode, so this is a hypothesis, not a known fix. The
# upstream OpenTUI bug (anomalyco/opencode #3927, #24735, #23524, #20986)
# reproduces without tmux. Compose in $EDITOR remains the reliable workaround.
set -g assume-paste-time 25

# Advertise OSC52 (the `Ms` capability) for all terminals so `set-clipboard on`
# actually fires. macOS's xterm-256color terminfo lacks Ms, so without this tmux
# never emits OSC52 and clipboard writes (especially from a remote tmux over SSH)
# silently fail. iTerm2 (with AllowClipboardAccess on) and Ghostty both accept
# OSC52; Ghostty's xterm-ghostty terminfo already advertises Ms, so this is a
# no-op there.
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Detect fallback copy command. These run SYNCHRONOUSLY and in priority order:
# last match wins, so pbcopy is checked last and correctly beats xclip on macOS.
# Do NOT add -b here. Backgrounding makes the three checks race, and on a Mac with
# homebrew xclip installed the xclip branch would win, leaving @copy_cmd set to a
# command that cannot work without a running X server.

if '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
  'set -g @copy_cmd "wl-copy"'

if '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip >/dev/null 2>&1' \
  'set -g @copy_cmd "xclip -selection clipboard"'

if 'command -v pbcopy >/dev/null 2>&1' \
  'set -g @copy_cmd "pbcopy"'

# 3. Bindings
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '#{?@copy_cmd,#{@copy_cmd},cat}'
bind -T copy-mode-vi Y send-keys -X copy-pipe '#{?@copy_cmd,#{@copy_cmd},cat}'
bind -T copy-mode     C-c send-keys -X copy-pipe-and-cancel '#{?@copy_cmd,#{@copy_cmd},cat}'

# 3b. Selection always belongs to tmux, even in mouse-capturing TUIs.
# tmux's defaults forward drag and multi-click to any app that turned on mouse
# reporting (#{mouse_any_flag}), which is why highlighting inside a full-screen
# TUI produced no selection tmux or the terminal could copy: the app ate it, and
# the only escape was holding Shift for native terminal selection.
#
# Apps want the mouse for CLICK and SCROLL. They rarely need DRAG. So these three
# drop mouse_any_flag from the condition and keep only #{pane_in_mode}: drag,
# double-click and triple-click now always drive tmux selection, in every pane,
# while MouseDown1Pane/MouseDown3Pane (notify.conf) and the wheel bindings still
# forward to the app untouched. Net effect: highlight-and-release copies, with no
# modifier, everywhere - the behaviour every other terminal has.
bind -T root MouseDrag1Pane \
  if-shell -F '#{pane_in_mode}' { send-keys -M } { copy-mode -M }
bind -T root DoubleClick1Pane select-pane -t = \; \
  if-shell -F '#{pane_in_mode}' { send-keys -M } \
    { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel '#{?@copy_cmd,#{@copy_cmd},cat}' }
bind -T root TripleClick1Pane select-pane -t = \; \
  if-shell -F '#{pane_in_mode}' { send-keys -M } \
    { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel '#{?@copy_cmd,#{@copy_cmd},cat}' }

# 4. Mouse capture toggle (prefix+m)
# On  = tmux owns the drag: copy-mode drag-select + tmux-yank copy (no Shift).
# Off = tmux releases the mouse so Ghostty native selection takes the whole grid
#       (cross-pane grabs). Off also disables tmux scroll + mouse pane-select until
#       toggled back; that is the native-selection mode. display-message runs after
#       `set`, so it reports the new state.
bind m set -g mouse \; display-message "mouse: #{?mouse,on,off}"
