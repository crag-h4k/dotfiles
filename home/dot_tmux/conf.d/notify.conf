# ~/.tmux/conf.d/notify.conf
##### Attention notification (Claude/Codex + shell processes) #####
# Triggers set @notify on the pane+window and recolor the pane via the helpers
# in ~/.config/notify/lib.sh: the Claude Code Stop / Notification /
# PreToolUse:AskUserQuestion hooks for AI attention, and zsh preexec/precmd
# (~/.zsh/custom/functions/notify-process.zsh) for finished long/named processes.
# All appearance/groups come from ~/.config/notify/notify.yaml. This file only
# renders the status-bar flag, colored per group via @notify_accent. Source after
# status.conf - it overrides window-status-format.

set -g visual-silence on
set -g monitor-bell off

# Clear the flag on real engagement only: a keypress or a mouse-button press in
# the flagged pane. Hover, mouse motion, scroll, focus, dropdown bring-up and
# window switches never clear. Apple trackpads emit wheel events on the faintest
# touch, so the wheel must not be a clear trigger. Selecting/focusing a pane does
# not clear either (an after-select-pane hook used to, but a dropdown re-selects
# the pane and wiped the flag before you could act).

# Keypress: clear, then forward the key unchanged. Specific root binds (prefix,
# etc.) still win, so tmux commands behave normally. `send-keys` with no arg
# forwards the key that triggered the Any binding.
bind-key -n -T root Any \
  if-shell -F '#{@notify}' \
    'run-shell "~/.config/notify/clear-pane.sh #{pane_id} key"' '' \; \
  send-keys

# Button press (left OR right): clear, select, and forward the click to the app so
# a mouse-aware TUI like Claude Code still receives it. This overrides tmux's
# default plain right-click pane menu; that menu stays on Alt+right-click (tmux's
# default M-MouseDown3Pane).
bind-key -T root MouseDown1Pane \
  if-shell -F -t = '#{@notify}' \
    'run-shell "~/.config/notify/clear-pane.sh #{mouse_pane} mouse-left"' '' \; \
  select-pane -t = \; send-keys -M
bind-key -T root MouseDown3Pane \
  if-shell -F -t = '#{@notify}' \
    'run-shell "~/.config/notify/clear-pane.sh #{mouse_pane} mouse-right"' '' \; \
  select-pane -t = \; send-keys -M

# Wheel: tmux's own mouse-aware routing, and NO clearing. Forward the wheel to a
# foreground TUI that requested mouse reporting (mouse_any_flag) so Claude Code
# scrolls its OWN conversation. A plain shell pane (no mouse mode) drops into
# copy-mode to browse tmux history, auto-exiting at the bottom (-e). This is
# tmux's default routing, restated so the intent is legible and no clear helper
# can creep back onto the wheel. Drag-select and copy-mode wheel/click use tmux's
# defaults (no override needed); prefix + [ reaches tmux history on any pane, and
# `prefix + m` toggles mouse off to hand the wheel to Ghostty.
bind-key -T root WheelUpPane \
  if-shell -F '#{mouse_any_flag}' \
    'send-keys -M' \
    'if-shell -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e"'
bind-key -T root WheelDownPane send-keys -M

# Pane border marker (only visible in split layouts): filled accent dot.
set -g pane-border-status top
set -g pane-border-format \
  '#{?@notify,#[bg=#{?@notify_accent,#{@notify_accent},#{?@palette_red,#{@palette_red},#ff5555}}]#[fg=black]#[bold] ● #[default] ,}#P:#{pane_current_command}'

# Window tab: fill the whole tab with the group accent when flagged so it stands
# out even when a TUI owns the pane. Overrides window-status-format from status.conf.
setw -g window-status-format \
  '#{?@notify,#[bg=#{?@notify_accent,#{@notify_accent},#{?@palette_red,#{@palette_red},#ff5555}}]#[fg=black]#[bold] #I:#W ● #[default], #I:#W }'
setw -g window-status-current-format \
  '#{?@notify,#[bg=#{?@notify_accent,#{@notify_accent},#{?@palette_red,#{@palette_red},#ff5555}}]#[fg=black]#[bold] #I:#W ● #[default], #I:#W }'
