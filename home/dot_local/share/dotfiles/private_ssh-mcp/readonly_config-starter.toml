# Copy to your platform's private SSH MCP config directory, then add host profiles.
# Linux: ~/.config/ssh-mcp/config.toml
# macOS: ~/Library/Application Support/ssh-mcp/config.toml
# Keep the directory mode 0700 and the file mode 0600.
[defaults]
approvalMode = "ask-all"

# Add only hosts you intend to expose to the agent. Pin each trusted host key:
# [[profiles]]
# name = "example"
# host = "example.invalid"
# user = "operator"
# auth = "agent"             # or "key" plus keyRef = "~/.ssh/id_ed25519"
# trustedHostKey = "SHA256:REPLACE_WITH_VERIFIED_HOST_FINGERPRINT"
# group = "prod"
# role = "viewer"
# readOnly = true
# approvalPolicy = "ask-all"
