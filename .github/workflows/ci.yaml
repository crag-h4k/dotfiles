---
name: ci

# Pull requests and main pushes run the same stable gate. Trixie and macOS
# deployment jobs are independent siblings so GitHub schedules them in parallel.
# A normal main merge only updates the Release Please PR; an actual release is
# created only when that accumulated release PR is deliberately merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-metadata:
    name: PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate branch and squash-merge title
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/validate-pr-metadata.sh

  pre-commit:
    uses: ./.github/workflows/pre-commit.yaml

  trixie-deployment:
    name: Trixie deployment
    runs-on: ubuntu-latest
    environment: trixie
    timeout-minutes: 20
    outputs:
      build: ${{ steps.outcomes.outputs.build }}
      install: ${{ steps.outcomes.outputs.install }}
      smoke: ${{ steps.outcomes.outputs.smoke }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build Trixie deployment image
        id: build
        continue-on-error: true
        run: >-
          docker build
          --file tests/trixie-deployment/Dockerfile.trixie
          --tag dotfiles-trixie-deployment
          .

      - name: Install dotfiles in Trixie
        id: install
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          docker run \
            --detach \
            --name dotfiles-trixie-deployment \
            dotfiles-trixie-deployment \
            sleep infinity
          docker exec dotfiles-trixie-deployment \
            bash /home/dotfiles/source/tests/trixie-deployment/deploy.sh

      - name: Smoke test Trixie deployment
        id: smoke
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: >-
          docker exec dotfiles-trixie-deployment
          bash /home/dotfiles/source/tests/deployment-smoke.sh

      - name: Stop Trixie deployment container
        if: always()
        run: docker rm --force dotfiles-trixie-deployment 2>/dev/null || true

      - name: Export Trixie phase outcomes
        id: outcomes
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            printf 'build=%s\n' "$BUILD_OUTCOME"
            printf 'install=%s\n' "$INSTALL_OUTCOME"
            printf 'smoke=%s\n' "$SMOKE_OUTCOME"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce successful Trixie deployment
        if: >-
          always() &&
          (steps.build.outcome != 'success' ||
          steps.install.outcome != 'success' ||
          steps.smoke.outcome != 'success')
        run: exit 1

  macos-deployment:
    name: macOS deployment
    runs-on: macos-15
    environment: macos
    timeout-minutes: 20
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    outputs:
      build: ${{ steps.outcomes.outputs.build }}
      install: ${{ steps.outcomes.outputs.install }}
      smoke: ${{ steps.outcomes.outputs.smoke }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build clean macOS deployment source
        id: build
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- \
            -b "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          tests/macos-deployment/build.sh \
            "$RUNNER_TEMP/dotfiles-source"

      - name: Install dotfiles on macOS
        id: install
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: tests/macos-deployment/deploy.sh

      - name: Smoke test macOS deployment
        id: smoke
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: tests/deployment-smoke.sh

      - name: Export macOS phase outcomes
        id: outcomes
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            printf 'build=%s\n' "$BUILD_OUTCOME"
            printf 'install=%s\n' "$INSTALL_OUTCOME"
            printf 'smoke=%s\n' "$SMOKE_OUTCOME"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce successful macOS deployment
        if: >-
          always() &&
          (steps.build.outcome != 'success' ||
          steps.install.outcome != 'success' ||
          steps.smoke.outcome != 'success')
        run: exit 1

  deployment-summary:
    name: Deployment PR summary
    needs: [trixie-deployment, macos-deployment]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Render deployment summary
        env:
          TRIXIE_BUILD: ${{ needs.trixie-deployment.outputs.build }}
          TRIXIE_INSTALL: ${{ needs.trixie-deployment.outputs.install }}
          TRIXIE_SMOKE: ${{ needs.trixie-deployment.outputs.smoke }}
          MACOS_BUILD: ${{ needs.macos-deployment.outputs.build }}
          MACOS_INSTALL: ${{ needs.macos-deployment.outputs.install }}
          MACOS_SMOKE: ${{ needs.macos-deployment.outputs.smoke }}
        run: >-
          .github/scripts/render-deployment-summary.sh
          deployment-summary.md

      - name: Update deployment summary comment
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: deployment-validation
          path: deployment-summary.md

  ci:
    name: CI
    needs: [pr-metadata, pre-commit, trixie-deployment, macos-deployment]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required CI jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_METADATA_RESULT: ${{ needs.pr-metadata.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          TRIXIE_RESULT: ${{ needs.trixie-deployment.result }}
          MACOS_RESULT: ${{ needs.macos-deployment.result }}
        run: |
          printf 'PR metadata: %s\n' "$PR_METADATA_RESULT"
          printf 'pre-commit: %s\n' "$PRE_COMMIT_RESULT"
          printf 'Trixie deployment: %s\n' "$TRIXIE_RESULT"
          printf 'macOS deployment: %s\n' "$MACOS_RESULT"
          if [[ "$EVENT_NAME" = pull_request ]]; then
            test "$PR_METADATA_RESULT" = success
          else
            test "$PR_METADATA_RESULT" = skipped
          fi
          test "$PRE_COMMIT_RESULT" = success
          test "$TRIXIE_RESULT" = success
          test "$MACOS_RESULT" = success

  release-please:
    name: Release Please
    needs: ci
    # always() is required: `ci` fans in over the PR-only `pr-metadata` job, which
    # is skipped on push. Without always(), that skipped sibling propagates through
    # the needs chain and skips this job even when `ci` itself succeeds. Re-gate
    # explicitly on the `ci` result so the release still only runs on a green main push.
    if: >-
      ${{ always()
      && needs.ci.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Open or update the release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
