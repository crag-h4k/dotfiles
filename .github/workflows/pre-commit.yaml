---
name: pre-commit

# Enforce the same hooks that run locally - including validate-templates.sh,
# which renders the component-gated chezmoi templates and parses the result.
# workflow_call-only: invoked by ci.yaml's pre-commit job for both the
# pull-request and push-to-main cases, so there is one run per push, not two.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # base16 scheme submodule, so build-palettes.py --check can verify the
          # committed catalog against upstream.
          submodules: recursive

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "latest"
          enable-cache: false

      # validate-templates.sh needs chezmoi to render the templates.
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Add chezmoi to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # luacheck and bats run as language:system pre-commit hooks, so they must
      # be on PATH. zsh is required by test_process.bats (_notify_resolve_bin
      # uses zsh-specific syntax and is tested via `zsh -c`).
      - name: Install luacheck, bats-core, and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks bats zsh
          sudo luarocks install luacheck

      # continue-on-error so the job reaches the explicit exit-1 below (which
      # fails it for real) with a recorded outcome. The pass/fail result surfaces
      # in the CI summary comment (ci.yaml's ci-summary job) via needs.pre-commit;
      # the full hook output stays in this job's log.
      - name: Run pre-commit
        id: run-pre-commit
        continue-on-error: true
        run: uvx pre-commit run --show-diff-on-failure --color=never --all-files

      - name: Fail if pre-commit failed
        if: steps.run-pre-commit.outcome == 'failure'
        run: exit 1
