---
name: pre-commit

# Enforce the same hooks that run locally - including validate-templates.sh,
# which renders the component-gated chezmoi templates and parses the result.
# workflow_call-only: invoked by ci.yaml's pre-commit job for both the
# pull-request and push-to-main cases, so there is one run per push, not two.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # base16 scheme submodule, so build-palettes.py --check can verify the
          # committed catalog against upstream.
          submodules: recursive

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # validate-templates.sh needs chezmoi to render the templates.
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Add chezmoi to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # luacheck and bats run as language:system pre-commit hooks, so they must
      # be on PATH. zsh is required by test_process.bats (_notify_resolve_bin
      # uses zsh-specific syntax and is tested via `zsh -c`).
      - name: Install bats-core, zsh, and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks bats zsh

      - name: Detect Lua version
        id: lua
        run: echo "version=$(luarocks config lua_version)" >> "$GITHUB_OUTPUT"

      - name: Cache luacheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.luarocks-tree
          key: luacheck-${{ runner.os }}-lua${{ steps.lua.outputs.version }}-1.2.0
          restore-keys: |
            luacheck-${{ runner.os }}-lua${{ steps.lua.outputs.version }}-

      - name: Install luacheck
        run: |
          luarocks install --tree "$HOME/.luarocks-tree" luacheck 1.2.0
          echo "$HOME/.luarocks-tree/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$(luarocks path --tree "$HOME/.luarocks-tree" --lr-path)" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(luarocks path --tree "$HOME/.luarocks-tree" --lr-cpath)" >> "$GITHUB_ENV"

      - name: Install pre-commit
        run: uv tool install pre-commit==4.6.1

      # continue-on-error so the job reaches the explicit exit-1 below (which
      # fails it for real) with a recorded outcome. The pass/fail result surfaces
      # in the CI summary comment (ci.yaml's ci-summary job) via needs.pre-commit;
      # the full hook output stays in this job's log.
      - name: Run pre-commit
        id: run-pre-commit
        continue-on-error: true
        run: pre-commit run --show-diff-on-failure --color=never --all-files

      - name: Fail if pre-commit failed
        if: steps.run-pre-commit.outcome == 'failure'
        run: exit 1
