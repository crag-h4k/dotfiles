# .github/workflows/pbvar-build.yaml
---
name: pbvar-build

# Test pbvar on PRs that touch its source, and publish per-arch binaries as a
# GitHub Release when a pbvar-v* tag is pushed. chezmoi fetches the matching asset
# to ~/.local/bin/pbvar (home/.chezmoiexternal.toml), so nothing is tracked in git.
# Pure Go (CGO_ENABLED=0): all arches cross-compile from one runner.
on:
  pull_request:
    paths:
      - "tools/pbvar/**"
      - ".github/workflows/pbvar-build.yaml"
  push:
    tags:
      - "pbvar-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pbvar (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            runner: ubuntu-24.04
            system: Linux
            machine: x86_64
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            system: Linux
            machine: aarch64
          - platform: macOS ARM64
            runner: macos-15
            system: Darwin
            machine: arm64
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_SYSTEM: ${{ matrix.system }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - name: Verify native runner architecture
        run: |
          test "$(uname -s)" = "$EXPECTED_SYSTEM"
          test "$(uname -m)" = "$EXPECTED_MACHINE"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/pbvar/go.mod
          cache-dependency-path: tools/pbvar/go.sum
      - name: Format, vet, test
        working-directory: tools/pbvar
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt needed on:"; gofmt -l .; exit 1
          fi
          go vet ./...
          go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/pbvar-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/pbvar/go.mod
          cache-dependency-path: tools/pbvar/go.sum
      - name: Cross-compile
        run: bash tools/pbvar/build.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            tools/pbvar/dist/pbvar_darwin_arm64 \
            tools/pbvar/dist/pbvar_linux_arm64 \
            tools/pbvar/dist/pbvar_linux_amd64 \
            --title "${GITHUB_REF_NAME}" \
            --notes "pbvar prebuilt binaries for darwin/arm64, linux/arm64, linux/amd64."
